# Abe policy for a Claude Agent SDK agent (FJP v0.1).
# action.type is the tool name (Bash, Write, Read, mcp__shop__buy, ...); the tool's input fields are action fields.
version: "0.1"
policy_id: claude-agent-sdk-example
policy_version: "2026-10-29"

# Anything no rule resolves requires judgment (fail closed).
defaults:
  unmatched: ESCALATE

rules:
  - id: read_only_tools
    when: { field: action.type, op: in, value: [Read, Glob, Grep, LS, TodoWrite] }
    decision: ACT

  - id: recursive_delete
    description: Never delete recursively
    when:
      all:
        - { field: action.type, op: eq, value: Bash }
        - any:
            - { field: action.command, op: contains, value: "rm -rf" }
            - { field: action.command, op: contains, value: "rm -r " }
            - { field: action.command, op: contains, value: "rm -fr" }
    decision: BLOCK
    reason_code: HARD_POLICY_VIOLATION

  - id: listing_commands
    when:
      all:
        - { field: action.type, op: eq, value: Bash }
        - { field: action.command, op: in, value: [ls, ls -la, pwd] }
    decision: ACT

  - id: write_notes
    description: The agent may write files under notes/
    when:
      all:
        - { field: action.type, op: in, value: [Write, Edit] }
        - { field: action.file_path, op: contains, value: "/notes/" }
    decision: ACT

  # Purchases: mcp__shop__buy is mapped to action.type "purchase" (action_types=...), so these rules
  # are the same ones a non-Claude purchasing agent would use.
  - id: routine_purchase
    when:
      all:
        - { field: action.type, op: eq, value: purchase }
        - { field: action.amount, op: lte, value: 500 }
    decision: ACT

  - id: purchase_review_limit
    description: Purchases above $10,000 require judgment
    when:
      all:
        - { field: action.type, op: eq, value: purchase }
        - { field: action.amount, op: gt, value: 10000 }
    decision: ESCALATE
    reason_code: FINANCIAL_THRESHOLD_EXCEEDED

  - id: purchase_hard_limit
    description: Never permit purchases above $100,000
    when:
      all:
        - { field: action.type, op: eq, value: purchase }
        - { field: action.amount, op: gt, value: 100000 }
    decision: BLOCK
    reason_code: HARD_POLICY_VIOLATION
