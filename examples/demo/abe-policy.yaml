# Abe policy for the $12,500 demo. Validate: abe validate-policy abe-policy.yaml
version: "0.1"
policy_id: demo-procurement
policy_version: "2026-10-13"

defaults:
  unmatched: ESCALATE

rules:
  - id: purchase_hard_limit
    description: Never permit purchases above $100,000
    when:
      all:
        - { field: action.type, op: eq, value: purchase }
        - { field: action.amount, op: gt, value: 100000 }
    decision: BLOCK
    reason_code: HARD_POLICY_VIOLATION

  - id: purchase_review_limit
    description: Purchases above $10,000 require judgment
    when:
      all:
        - { field: action.type, op: eq, value: purchase }
        - { field: action.amount, op: gt, value: 10000 }
    decision: ESCALATE
    reason_code: FINANCIAL_THRESHOLD_EXCEEDED

  - id: routine_purchase
    description: Purchases up to $500 are routine
    when:
      all:
        - { field: action.type, op: eq, value: purchase }
        - { field: action.amount, op: lte, value: 500 }
    decision: ACT

confidence:
  minimum_to_act: 0.90
